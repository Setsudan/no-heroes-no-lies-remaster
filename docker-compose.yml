version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: no_heroes_no_lies
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 4000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: no_heroes_no_lies
      JWT_SECRET: change-me
    depends_on:
      - db
    ports:
      - "4001:4000"

volumes:
  db-data:

